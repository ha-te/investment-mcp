name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investment_mcp_deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: investment_mcp_deploy/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - run: python -m compileall -q .
      - run: docker build -t investment-mcp:test .
      - run: bash test_container.sh investment-mcp:test
