name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: vars.FREE_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investment_mcp_deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: investment_mcp_deploy/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - run: python -m compileall -q .
      - run: docker build -t investment-mcp:test .
      - run: bash test_container.sh investment-mcp:test

  free-worker:
    if: vars.FREE_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: free_worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: free_worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
