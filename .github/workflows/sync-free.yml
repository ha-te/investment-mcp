name: Free watchlist sync
on:
  schedule:
    - cron: '15 9 * * 1-5'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional existing owner job id; empty selects queued/scheduled work'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: free-d1-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.FREE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: investment_mcp_deploy/requirements.lock
      - run: pip install --require-hashes -r investment_mcp_deploy/requirements.lock
      - name: Validate locally and atomically publish D1 units
        run: python investment_mcp_deploy/free_sync.py --job-id "$REQUESTED_JOB_ID"
        env:
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
          FREE_MCP_ORIGIN: ${{ vars.FREE_MCP_ORIGIN }}
          INVESTMENT_SYMBOLS: ${{ vars.INVESTMENT_SYMBOLS }}
          JQUANTS_AVAILABLE_FROM: ${{ vars.JQUANTS_AVAILABLE_FROM }}
          JQUANTS_AVAILABLE_THROUGH: ${{ vars.JQUANTS_AVAILABLE_THROUGH }}
          JQUANTS_DATA_DELAY_DAYS: ${{ vars.JQUANTS_DATA_DELAY_DAYS || '0' }}
          JQUANTS_INTERVAL_SECONDS: '12.2'
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
