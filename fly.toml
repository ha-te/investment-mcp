# Replace app with your globally unique name before first deployment.
app = "investment-mcp-CHANGE-ME"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  INVESTMENT_DB = "/data/investment.sqlite"
  INVESTMENT_DATA_DIR = "/data"
  INVESTMENT_SCHEDULE_ENABLED = "true"
  JQUANTS_INTERVAL_SECONDS = "12.2"

[[mounts]]
  source = "investment_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
